name: MyToolbox
options:
  bundleIdPrefix: com.example.mytoolbox
  deploymentTarget:
    iOS: "17.0"
  createScheme: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.example.mytoolbox
    ENABLE_BITCODE: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    INFOPLIST_FILE: MyToolbox/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ONLY_ACTIVE_ARCH: "NO"
targets:
  MyToolbox:
    type: application
    platform: iOS
    sources:
      - path: Sources/MyToolbox
      - path: MyToolbox/Assets.xcassets
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
